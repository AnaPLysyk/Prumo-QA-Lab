name: Prumo QA - laboratorio de automacao
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      qa_ref:
        description: Branch, tag ou SHA do Prumo QA a validar
        required: true
        default: main
        type: string
permissions:
  contents: read
jobs:
  validar-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
  validar-prumo-qa:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: AnaPLysyk/Prumo-Qa
          ref: ${{ inputs.qa_ref }}
          path: prumoqa
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
        working-directory: prumoqa
      - run: npm ci --prefix backend/login/servidor --omit=dev
        working-directory: prumoqa
      - run: npm run build
        working-directory: prumoqa
      - run: node automacao/prumo-qa/executar.mjs --qa prumoqa --tipo smoke
      - run: node automacao/prumo-qa/executar.mjs --qa prumoqa --tipo regressao
      - run: node automacao/prumo-qa/executar.mjs --qa prumoqa --tipo integracao
      - run: node automacao/prumo-qa/executar.mjs --qa prumoqa --tipo e2e
